server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: vibemynight-backend

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:vibemynight}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:${MYSQLUSER:root}}
    password: ${DATABASE_PASSWORD:${MYSQLPASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-env-this-is-a-dev-only-default-secret-value}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  image-storage:
    url: ${IMAGE_STORAGE_URL:http://localhost:8080/uploads}
    key: ${IMAGE_STORAGE_KEY:}
    local-path: ${IMAGE_STORAGE_LOCAL_PATH:./uploads}
  whatsapp:
    number: ${WHATSAPP_NUMBER:917041615131}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
