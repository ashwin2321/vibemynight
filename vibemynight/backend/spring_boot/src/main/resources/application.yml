server:
  port: ${PORT:8080}
  address: 0.0.0.0
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true

spring:
  application:
    name: vibemynight-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${MYSQLUSER:neondb_owner}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${MYSQLPASSWORD:}}}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      keepalive-time: 30000
      leak-detection-threshold: 25000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-env-this-is-a-dev-only-default-secret-value}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  image-storage:
    url: ${IMAGE_STORAGE_URL:http://localhost:8080/uploads}
    key: ${IMAGE_STORAGE_KEY:}
    local-path: ${IMAGE_STORAGE_LOCAL_PATH:./uploads}
  whatsapp:
    number: ${WHATSAPP_NUMBER:917041615131}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
