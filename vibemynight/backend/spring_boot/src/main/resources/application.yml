server:
  port: ${PORT:8080}

spring:
  application:
    name: vibemynight-backend

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/vibemynight?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # ddl-auto is 'update' for local dev convenience.
      # Switch to 'validate' once db/migration SQL is the source of truth in a real environment.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-env-this-is-a-dev-only-default-secret-value}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  image-storage:
    url: ${IMAGE_STORAGE_URL:http://localhost:8080/uploads}
    key: ${IMAGE_STORAGE_KEY:}
    local-path: ${IMAGE_STORAGE_LOCAL_PATH:./uploads}
  whatsapp:
    number: ${WHATSAPP_NUMBER:917041615131}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
