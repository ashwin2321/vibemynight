server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/wasm application/xml+rss application/atom+xml image/svg+xml;

    location / {
        try_files  / /index.html;
    }

    location ~* \.(?:css|js|wasm|png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control public, max-age=31536000, immutable;
        try_files  =404;
    }

    location ~* (?:index\.html|flutter_bootstrap\.js|version\.json)$ {
        expires -1;
        add_header Cache-Control no-store, no-cache, must-revalidate, max-age=0;
    }
}
