<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Experience The Night. Create The Memory. Discover the best Navratri garba nights, DJ concerts, passes and artists with VibeMyNight.">
  <meta name="keywords" content="VibeMyNight, Navratri passes, Garba events, DJ nights, event booking, nightlife Gujarat, Surat events">
  <meta name="theme-color" content="#07070E">

  <!-- OpenGraph / Facebook / WhatsApp Preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="VibeMyNight - Event Discovery & Pass Inquiry Platform">
  <meta property="og:description" content="Discover the best Navratri garba nights, DJ concerts, passes and artists with instant WhatsApp booking.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:site_name" content="VibeMyNight">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="VibeMyNight - Event Discovery & Passes">
  <meta name="twitter:description" content="Discover premier events, artist lineups and secure passes directly on WhatsApp.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- iOS & Android mobile meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VibeMyNight">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>VibeMyNight - Event Discovery & Passes</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      background-color: #07070E;
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #vmn-apple-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, #15102A 0%, #07070E 70%);
      z-index: 9999999;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .vmn-loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: vmn-intro 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .vmn-logo-box {
      position: relative;
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: vmn-pulse 2.2s ease-in-out infinite alternate;
    }
    .vmn-logo-glow {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.45) 0%, rgba(236, 72, 153, 0.2) 50%, transparent 70%);
      filter: blur(14px);
      z-index: 1;
      animation: glow-breathe 2.2s ease-in-out infinite alternate;
    }
    .vmn-logo-img {
      position: relative;
      width: 80px;
      height: 80px;
      object-fit: contain;
      z-index: 2;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.6));
    }
    .vmn-brand-text {
      margin-top: 18px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 3.5px;
      background: linear-gradient(135deg, #FFFFFF 20%, #E9D5FF 60%, #C084FC 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.95;
    }
    .vmn-progress-track {
      margin-top: 28px;
      width: 130px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }
    .vmn-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #A855F7, #EC4899, #60A5FA);
      border-radius: 99px;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
      animation: vmn-bar-flow 1.5s ease-in-out infinite;
    }
    @keyframes vmn-intro {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    @keyframes vmn-pulse {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(1.04);
      }
    }
    @keyframes glow-breathe {
      0% {
        opacity: 0.5;
        transform: scale(0.9);
      }
      100% {
        opacity: 0.95;
        transform: scale(1.15);
      }
    }
    @keyframes vmn-bar-flow {
      0% {
        left: -40%;
        width: 30%;
      }
      50% {
        width: 55%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }
    /* Suppress old default Flutter progress bar only */
    .flutter-loader {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="vmn-apple-loader">
    <div class="vmn-loader-content">
      <div class="vmn-logo-box">
        <div class="vmn-logo-glow"></div>
        <img src="favicon.png" alt="VibeMyNight Logo" class="vmn-logo-img" />
      </div>
      <div class="vmn-brand-text">VIBEMYNIGHT</div>
      <div class="vmn-progress-track">
        <div class="vmn-progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    window.dismissVmnLoader = function() {
      var loader = document.getElementById('vmn-apple-loader');
      if (loader && !loader.classList.contains('dismissed')) {
        loader.classList.add('dismissed');
        loader.style.opacity = '0';
        loader.style.transform = 'scale(1.02)';
        loader.style.pointerEvents = 'none';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    };

    window.addEventListener('flutter-first-frame', function() {
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          window.dismissVmnLoader();
        });
      });
    });

    // Fallback dismiss
    setTimeout(window.dismissVmnLoader, 3500);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
