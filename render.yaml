services:
  - type: web
    name: vibemynight-backend
    runtime: docker
    dockerfilePath: vibemynight/backend/spring_boot/Dockerfile
    dockerContext: vibemynight/backend/spring_boot
    rootDir: vibemynight/backend/spring_boot
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
